name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy (native-tls)
        run: cargo clippy --all-targets -- -D warnings
      - name: Clippy (rustls-tls)
        run: cargo clippy --all-targets --no-default-features --features rustls-tls -- -D warnings
      - name: Clippy (rustls-tls + ws)
        run: cargo clippy --all-targets --no-default-features --features rustls-tls,ws -- -D warnings
      - name: Clippy (all features)
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test
      - name: Test (all features)
        run: cargo test --all-features
      - name: Docs
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@v2
      - name: Build on the minimum supported Rust version
        run: |
          cargo build --lib --locked
          cargo build --lib --locked --all-features
